<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Pitch Monitor</title>
  <style>
    :root {
      --bg-0: #0f172a;
      --bg-1: #172554;
      --panel: rgba(15, 23, 42, 0.8);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #f59e0b;
      --good: #22c55e;
      --warn: #f97316;
      --bad: #ef4444;
      --grid-major: rgba(148, 163, 184, 0.34);
      --grid-minor: rgba(148, 163, 184, 0.16);
      --curve: #22d3ee;
      --curve-muted: rgba(34, 211, 238, 0.25);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, #1e3a8a 0%, transparent 44%),
        radial-gradient(circle at 80% 15%, #0ea5e9 0%, transparent 38%),
        linear-gradient(165deg, var(--bg-0), var(--bg-1));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 18px;
      backdrop-filter: blur(7px);
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    .range-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 999px;
      padding: 4px;
    }

    .range-switch button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .range-switch button.active {
      background: linear-gradient(145deg, #0ea5e9, #0284c7);
      color: #e0f2fe;
    }

    #status {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      letter-spacing: 0.02em;
    }

    #toggleMicBtn {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      background: linear-gradient(145deg, #06b6d4, #0284c7);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease, opacity 0.2s ease;
    }

    #toggleMicBtn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    #toggleMicBtn:active {
      transform: translateY(1px);
    }

    #toggleMicBtn.running {
      background: linear-gradient(145deg, #f97316, #ea580c);
      color: #fff7ed;
    }

    .pitch-readout {
      text-align: center;
      border-radius: 14px;
      padding: 20px 12px;
      background: linear-gradient(
        180deg,
        rgba(30, 41, 59, 0.6),
        rgba(2, 6, 23, 0.45)
      );
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    #noteDisplay {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.3rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);
    }

    #centsDisplay {
      margin: 8px 0 0;
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .chart-wrap {
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.5), rgba(15, 23, 42, 0.2));
      border: 1px solid rgba(148, 163, 184, 0.16);
      overflow: hidden;
      min-height: 320px;
    }

    #pitchCanvas {
      width: 100%;
      height: 340px;
      display: block;
    }

    .meta {
      color: var(--muted);
      font-size: 0.88rem;
      text-align: right;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      .app {
        padding: 14px;
      }

      .top-row {
        grid-template-columns: 1fr;
      }

      #toggleMicBtn {
        width: 100%;
      }

      .range-switch {
        width: 100%;
        justify-content: center;
      }

      #pitchCanvas {
        height: 290px;
      }

      .meta {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top-row">
      <p id="status">Ready. Click start to enable the microphone.</p>
      <div class="range-switch" role="group" aria-label="Vocal range">
        <button id="maleBtn" type="button" aria-pressed="false">Male</button>
        <button id="femaleBtn" type="button" class="active" aria-pressed="true">Female</button>
      </div>
      <button id="toggleMicBtn" type="button">Start Microphone</button>
    </div>

    <section class="pitch-readout" aria-live="polite">
      <h1 id="noteDisplay">--</h1>
      <p id="centsDisplay">No pitch detected</p>
    </section>

    <section class="chart-wrap">
      <canvas id="pitchCanvas" width="900" height="340"></canvas>
    </section>

    <p class="meta">Window: last 12 seconds | Buffer: 2048 samples</p>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const buttonEl = document.getElementById("toggleMicBtn");
    const maleBtnEl = document.getElementById("maleBtn");
    const femaleBtnEl = document.getElementById("femaleBtn");
    const noteEl = document.getElementById("noteDisplay");
    const centsEl = document.getElementById("centsDisplay");
    const canvas = document.getElementById("pitchCanvas");
    const ctx = canvas.getContext("2d");

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const HISTORY_SECONDS = 12;
    const BUFFER_SIZE = 2048;
    const RMS_GATE = 0.01;

    const RANGE_PRESETS = {
      male: {
        min: 48, // C3
        max: 60, // C4
        axisLabels: [48, 50, 52, 53, 55, 57, 59, 60]
      },
      female: {
        min: 60, // C4
        max: 72, // C5
        axisLabels: [60, 62, 64, 65, 67, 69, 71, 72]
      }
    };

    let currentRangeMode = "female";
    let currentRange = RANGE_PRESETS[currentRangeMode];

    let audioCtx = null;
    let micStream = null;
    let sourceNode = null;
    let scriptNode = null;
    let isRunning = false;
    let animationId = null;

    const pitchHistory = [];

    function formatNoteName(midiInt) {
      const name = NOTE_NAMES[(midiInt + 1200) % 12];
      const octave = Math.floor(midiInt / 12) - 1;
      return `${name}${octave}`;
    }

    function frequencyToMidi(frequency) {
      return 69 + 12 * Math.log2(frequency / 440);
    }

    function frequencyToNoteData(frequency) {
      const midiFloat = frequencyToMidi(frequency);
      const nearestMidi = Math.round(midiFloat);
      const cents = Math.round((midiFloat - nearestMidi) * 100);
      return {
        frequency,
        midiFloat,
        nearestMidi,
        noteName: formatNoteName(nearestMidi),
        cents
      };
    }

    function rms(buffer) {
      let sum = 0;
      for (let i = 0; i < buffer.length; i += 1) {
        const v = buffer[i];
        sum += v * v;
      }
      return Math.sqrt(sum / buffer.length);
    }

    // Efficient YIN pitch detector for real-time use.
    function detectPitchYIN(buffer, sampleRate) {
      const threshold = 0.12;
      const probabilityThreshold = 0.1;
      const yinBufferLength = Math.floor(buffer.length / 2);
      const yinBuffer = new Float32Array(yinBufferLength);

      const tauMin = Math.max(2, Math.floor(sampleRate / 1100));
      const tauMax = Math.min(yinBufferLength - 1, Math.floor(sampleRate / 50));

      for (let tau = tauMin; tau < tauMax; tau += 1) {
        let diff = 0;
        for (let i = 0; i < yinBufferLength; i += 1) {
          const delta = buffer[i] - buffer[i + tau];
          diff += delta * delta;
        }
        yinBuffer[tau] = diff;
      }

      yinBuffer[0] = 1;
      let runningSum = 0;
      for (let tau = 1; tau < tauMax; tau += 1) {
        runningSum += yinBuffer[tau];
        yinBuffer[tau] = runningSum === 0 ? 1 : (yinBuffer[tau] * tau) / runningSum;
      }

      let tauEstimate = -1;
      for (let tau = tauMin; tau < tauMax; tau += 1) {
        if (yinBuffer[tau] < threshold) {
          while (tau + 1 < tauMax && yinBuffer[tau + 1] < yinBuffer[tau]) {
            tau += 1;
          }
          tauEstimate = tau;
          break;
        }
      }

      if (tauEstimate === -1) {
        return null;
      }

      const probability = 1 - yinBuffer[tauEstimate];
      if (probability < probabilityThreshold) {
        return null;
      }

      // Parabolic interpolation for sub-sample lag precision.
      const x0 = tauEstimate > 1 ? tauEstimate - 1 : tauEstimate;
      const x2 = tauEstimate + 1 < tauMax ? tauEstimate + 1 : tauEstimate;

      if (x0 === tauEstimate || x2 === tauEstimate) {
        return sampleRate / tauEstimate;
      }

      const s0 = yinBuffer[x0];
      const s1 = yinBuffer[tauEstimate];
      const s2 = yinBuffer[x2];
      const a = (s0 + s2 - 2 * s1) / 2;
      const b = (s2 - s0) / 2;

      const betterTau = Math.abs(a) < 1e-8 ? tauEstimate : tauEstimate - b / (2 * a);
      if (betterTau <= 0) {
        return null;
      }

      return sampleRate / betterTau;
    }

    function updateTextDisplay(noteData) {
      if (!noteData) {
        noteEl.textContent = "--";
        centsEl.textContent = "No pitch detected";
        centsEl.style.color = "var(--muted)";
        return;
      }

      noteEl.textContent = noteData.noteName;
      const sign = noteData.cents > 0 ? "+" : "";
      centsEl.textContent = `${sign}${noteData.cents} cents (${noteData.frequency.toFixed(1)} Hz)`;

      const absCents = Math.abs(noteData.cents);
      if (absCents <= 10) {
        centsEl.style.color = "var(--good)";
      } else if (absCents <= 25) {
        centsEl.style.color = "var(--warn)";
      } else {
        centsEl.style.color = "var(--bad)";
      }
    }

    function pushHistory(midiFloatOrNull) {
      const now = performance.now() / 1000;
      pitchHistory.push({
        t: now,
        midi: midiFloatOrNull
      });

      const cutoff = now - HISTORY_SECONDS;
      while (pitchHistory.length > 0 && pitchHistory[0].t < cutoff) {
        pitchHistory.shift();
      }
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const displayWidth = Math.floor(canvas.clientWidth);
      const displayHeight = Math.floor(canvas.clientHeight);

      const needResize = canvas.width !== Math.floor(displayWidth * dpr) ||
        canvas.height !== Math.floor(displayHeight * dpr);

      if (needResize) {
        canvas.width = Math.floor(displayWidth * dpr);
        canvas.height = Math.floor(displayHeight * dpr);
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function midiToY(midi, height, topPad, bottomPad) {
      const usableHeight = height - topPad - bottomPad;
      const clamped = Math.max(currentRange.min, Math.min(currentRange.max, midi));
      const ratio = (clamped - currentRange.min) / (currentRange.max - currentRange.min);
      return height - bottomPad - ratio * usableHeight;
    }

    function setRangeMode(mode) {
      currentRangeMode = mode;
      currentRange = RANGE_PRESETS[mode];

      maleBtnEl.classList.toggle("active", mode === "male");
      femaleBtnEl.classList.toggle("active", mode === "female");
      maleBtnEl.setAttribute("aria-pressed", String(mode === "male"));
      femaleBtnEl.setAttribute("aria-pressed", String(mode === "female"));

      drawPitchChart();
    }

    function drawPitchChart() {
      resizeCanvasToDisplaySize();

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const leftPad = 52;
      const rightPad = 10;
      const topPad = 12;
      const bottomPad = 24;

      ctx.clearRect(0, 0, width, height);

      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, "rgba(15, 23, 42, 0.52)");
      bg.addColorStop(1, "rgba(2, 6, 23, 0.82)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      // Draw horizontal semitone grid lines.
      for (let midi = currentRange.min; midi <= currentRange.max; midi += 1) {
        const y = midiToY(midi, height, topPad, bottomPad);
        const isAxisNote = currentRange.axisLabels.includes(midi);
        ctx.strokeStyle = isAxisNote ? "var(--grid-major)" : "var(--grid-minor)";
        ctx.lineWidth = isAxisNote ? 1.1 : 0.6;
        ctx.beginPath();
        ctx.moveTo(leftPad, y);
        ctx.lineTo(width - rightPad, y);
        ctx.stroke();

        // Midpoint between semitones = +/-50 cents marker.
        if (midi < currentRange.max) {
          const yMid = midiToY(midi + 0.5, height, topPad, bottomPad);
          ctx.strokeStyle = "rgba(148, 163, 184, 0.1)";
          ctx.setLineDash([3, 5]);
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(leftPad, yMid);
          ctx.lineTo(width - rightPad, yMid);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // Draw the exact requested Y-axis note labels.
      ctx.fillStyle = "rgba(226, 232, 240, 0.82)";
      ctx.font = "12px Avenir Next, Segoe UI, sans-serif";
      ctx.textAlign = "right";
      for (const midi of currentRange.axisLabels) {
        const y = midiToY(midi, height, topPad, bottomPad);
        ctx.fillText(formatNoteName(midi), leftPad - 7, y + 4);
      }

      ctx.strokeStyle = "rgba(148, 163, 184, 0.34)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(leftPad, topPad);
      ctx.lineTo(leftPad, height - bottomPad);
      ctx.lineTo(width - rightPad, height - bottomPad);
      ctx.stroke();

      const now = performance.now() / 1000;
      const timeStart = now - HISTORY_SECONDS;
      const plotWidth = width - leftPad - rightPad;

      // Soft glow line underlay.
      ctx.strokeStyle = "var(--curve-muted)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      let startedGlow = false;
      for (let i = 0; i < pitchHistory.length; i += 1) {
        const point = pitchHistory[i];
        if (point.midi == null) {
          startedGlow = false;
          continue;
        }
        const x = leftPad + ((point.t - timeStart) / HISTORY_SECONDS) * plotWidth;
        const y = midiToY(point.midi, height, topPad, bottomPad);
        if (!startedGlow) {
          ctx.moveTo(x, y);
          startedGlow = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();

      // Main pitch curve.
      ctx.strokeStyle = "var(--curve)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i < pitchHistory.length; i += 1) {
        const point = pitchHistory[i];
        if (point.midi == null) {
          started = false;
          continue;
        }

        const x = leftPad + ((point.t - timeStart) / HISTORY_SECONDS) * plotWidth;
        const y = midiToY(point.midi, height, topPad, bottomPad);

        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();

      ctx.fillStyle = "rgba(148, 163, 184, 0.8)";
      ctx.font = "12px Avenir Next, Segoe UI, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Pitch curve (newest on the right)", leftPad + 6, topPad + 14);
      ctx.fillText("+/-50c lines are dashed", leftPad + 6, topPad + 30);
    }

    function animationLoop() {
      drawPitchChart();
      animationId = requestAnimationFrame(animationLoop);
    }

    async function startMicrophone() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          },
          video: false
        });

        sourceNode = audioCtx.createMediaStreamSource(micStream);
        scriptNode = audioCtx.createScriptProcessor(BUFFER_SIZE, 1, 1);

        scriptNode.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          const level = rms(input);

          if (level < RMS_GATE) {
            updateTextDisplay(null);
            pushHistory(null);
            return;
          }

          const pitchHz = detectPitchYIN(input, audioCtx.sampleRate);
          if (!pitchHz || !Number.isFinite(pitchHz)) {
            updateTextDisplay(null);
            pushHistory(null);
            return;
          }

          const noteData = frequencyToNoteData(pitchHz);
          updateTextDisplay(noteData);
          pushHistory(noteData.midiFloat);
        };

        sourceNode.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);

        isRunning = true;
        buttonEl.textContent = "Stop Microphone";
        buttonEl.classList.add("running");
        statusEl.textContent = "Microphone active. Start singing to monitor your pitch.";

        if (!animationId) {
          animationLoop();
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Could not start microphone. Check browser permission and HTTPS/localhost context.";
        await stopMicrophone();
      }
    }

    async function stopMicrophone() {
      isRunning = false;

      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode.onaudioprocess = null;
        scriptNode = null;
      }

      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }

      if (micStream) {
        micStream.getTracks().forEach((track) => track.stop());
        micStream = null;
      }

      if (audioCtx) {
        await audioCtx.close();
        audioCtx = null;
      }

      buttonEl.textContent = "Start Microphone";
      buttonEl.classList.remove("running");
      statusEl.textContent = "Stopped. Click start to enable the microphone.";
      updateTextDisplay(null);

      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      drawPitchChart();
    }

    buttonEl.addEventListener("click", async () => {
      if (isRunning) {
        await stopMicrophone();
      } else {
        await startMicrophone();
      }
    });

    maleBtnEl.addEventListener("click", () => {
      setRangeMode("male");
    });

    femaleBtnEl.addEventListener("click", () => {
      setRangeMode("female");
    });

    window.addEventListener("resize", drawPitchChart);
    setRangeMode("female");
    drawPitchChart();
  </script>
</body>
</html>
